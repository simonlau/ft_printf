repos:
  - repo: local
    hooks:
      - id: norminette
        name: norminette
        entry: norminette
        language: system
        files: ^[^/]+\.(c|h)$
        verbose: true

      - id: make-test
        name: make test
        entry: make test
        language: system
        always_run: true
        pass_filenames: false
        verbose: true
